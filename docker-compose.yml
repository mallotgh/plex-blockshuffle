services:
  blockshuffle:
    build: .
    image: plex-blockshuffle:latest
    container_name: plex-blockshuffle
    ports:
      - "8973:8973"
    environment:
      APP_BASE_URL: ${APP_BASE_URL}
      PLEX_PRODUCT: ${PLEX_PRODUCT:-Plex Blockshuffle}
    volumes:
      - ./config:/config
    restart: unless-stopped
